syntax = "proto3";

package agentflow.proto;

import "errors.proto";

message TokenPayload {
  string token = 1;
}

message NodeStartPayload {
  // intentionally empty — node id and timestamp are on the envelope
}

message NodeEndPayload {
  bool cancelled = 1;
  bool failed = 2;
}

message ToolCallPayload {
  string tool_name = 1;
  string args_json = 2;
  string tool_call_id = 3;
}

message ToolReturnPayload {
  string tool_name = 1;
  string result_json = 2;
  string tool_call_id = 3;
}

message EdgeFirePayload {
  string from_node = 1;
  string to_node = 2;
  int32 activation_group = 3;
}

message FinalPayload {
  bytes final_state = 1;     // serialized user state proto
  optional ErrorEvent error = 2;
}

message GraphDonePayload {
  bool failed = 1;
}

message WorkflowRegisteredPayload {
  string name    = 1;
  string version = 2;
  bool   signed_ = 3;  // proto reserves bare `signed`; rename in C++ via reflection
  string key_id  = 4;
}

message WorkflowUnregisteredPayload {
  string name    = 1;
  string version = 2;
}

message SubAgentStartPayload {
  string parent_agent       = 1;
  string child_agent        = 2;
  string invocation_id      = 3;
  string root_invocation_id = 4;
  uint32 depth              = 5;
  string goal               = 6;
}

message SubAgentEndPayload {
  string invocation_id = 1;
  uint32 depth         = 2;
  bool   success       = 3;
  string error_kind    = 4;
  uint32 output_chars  = 5;
}

message SubAgentExtractFailedPayload {
  string invocation_id = 1;
  string json_path     = 2;
}

message TraceEvent {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    NODE_START = 1;
    NODE_END = 2;
    TOKEN = 3;
    TOOL_CALL = 4;
    TOOL_RETURN = 5;
    EDGE_FIRE = 6;
    NODE_FAILED = 7;
    GRAPH_DONE = 8;
    SUB_AGENT_START          = 9;
    SUB_AGENT_END            = 10;
    SUB_AGENT_EXTRACT_FAILED = 11;
    WORKFLOW_REGISTERED      = 12;
    WORKFLOW_UNREGISTERED    = 13;
  }

  Kind kind = 1;
  string node_id = 2;
  int64 unix_micros = 3;

  oneof payload {
    TokenPayload token = 10;
    NodeStartPayload node_start = 11;
    NodeEndPayload node_end = 12;
    ToolCallPayload tool_call = 13;
    ToolReturnPayload tool_return = 14;
    EdgeFirePayload edge_fire = 15;
    ErrorEvent failure = 16;
    FinalPayload final = 17;
    GraphDonePayload graph_done = 18;
    WorkflowRegisteredPayload   workflow_registered   = 19;
    WorkflowUnregisteredPayload workflow_unregistered = 20;
    SubAgentStartPayload         sub_agent_start         = 21;
    SubAgentEndPayload           sub_agent_end           = 22;
    SubAgentExtractFailedPayload sub_agent_extract_failed = 23;
  }
}
